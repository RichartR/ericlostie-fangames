name: Keep Supabase Active

on:
  schedule:
    # Se ejecuta cada 3 días a las 06:00 UTC para evitar la pausa por inactividad de 7 días
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub cuando se desee

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Error: Falta configurar VITE_SUPABASE_URL o VITE_SUPABASE_ANON_KEY en los Secrets de GitHub."
            echo "Ve a Settings > Secrets and variables > Actions y añádelos."
            exit 1
          fi
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/games?select=id&limit=1" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          
          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Ping exitoso a Supabase (HTTP $RESPONSE). Proyecto activo y despierto."
          else
            echo "Error: Respuesta HTTP $RESPONSE al conectar con Supabase."
            exit 1
          fi
